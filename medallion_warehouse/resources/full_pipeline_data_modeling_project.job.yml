resources:
  jobs:
    full_pipeline_data_modeling_project:
      name: Full Pipeline (Data modeling project)
      tasks:
        - task_key: Check_Source_Exists
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Check_Source_Exists
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Initial_batch_load
          depends_on:
            - task_key: Check_Source_Exists
          condition_task:
            left: '{{tasks.Check_Source_Exists.values.source_exists}}'
            op: EQUAL_TO
            right: True
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Batch
          depends_on:
            - outcome: "true"
              task_key: Initial_batch_load
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Batch_load
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Initial_load
          depends_on:
            - outcome: "false"
              task_key: Initial_batch_load
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Source_initial_load
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Bronze
          depends_on:
            - task_key: Batch
            - task_key: Initial_load
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Bronze
            source: WORKSPACE
          run_if: AT_LEAST_ONE_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Silver
          depends_on:
            - task_key: Bronze
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Silver
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Gold
          depends_on:
            - task_key: Silver
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Gold
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: Data_quality_checks
          depends_on:
            - task_key: Gold
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: /Workspace/Users/m.kowalczyk2112@gmail.com/Databricks-Medallion-Architecture-Project/Data_Quality_Checks
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      git_source:
        git_branch: main
        git_provider: gitHub
        git_url: https://github.com/Matt-60/Databricks-Medallion-Architecture-Project
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
