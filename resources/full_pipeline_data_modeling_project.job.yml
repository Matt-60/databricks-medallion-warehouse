resources:
  jobs:
    full_pipeline_data_modeling_project:
      name: Full Pipeline (Data modeling project)
      max_concurrent_runs: 1

      tasks:
        - task_key: Check_Source_Exists
          environment_key: Default
          notebook_task:
            notebook_path: ../Check_Source_Exists.ipynb

        - task_key: Initial_batch_load
          depends_on:
            - task_key: Check_Source_Exists
          condition_task:
            left: "{{tasks.Check_Source_Exists.values.source_exists}}"
            op: EQUAL_TO
            right: "true"

        - task_key: Batch
          depends_on:
            - task_key: Initial_batch_load
              outcome: "true"
          environment_key: Default
          notebook_task:
            notebook_path: ../Batch_load.ipynb

        - task_key: Initial_load
          depends_on:
            - task_key: Initial_batch_load
              outcome: "false"
          environment_key: Default
          notebook_task:
            notebook_path: ../Source_initial_load.ipynb

        - task_key: Bronze
          depends_on:
            - task_key: Batch
            - task_key: Initial_load
          run_if: AT_LEAST_ONE_SUCCESS
          environment_key: Default
          notebook_task:
            notebook_path: ../Bronze.ipynb

        - task_key: Silver
          depends_on:
            - task_key: Bronze
          environment_key: Default
          notebook_task:
            notebook_path: ../Silver.ipynb

        - task_key: Gold
          depends_on:
            - task_key: Silver
          environment_key: Default
          notebook_task:
            notebook_path: ../Gold.ipynb

        - task_key: Data_quality_checks
          depends_on:
            - task_key: Gold
          environment_key: Default
          notebook_task:
            notebook_path: ../Data_Quality_Checks.ipynb

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"